[project]
name = "agrimitra-api"
version = "2.0.0"
description = "AgriMitra Climate — core domain API (farm intelligence, risk, suitability, advisory, district analytics)"
requires-python = ">=3.11"
# Lower bounds, not pins: pydantic-core has no wheel for Python 3.14 below 2.12,
# and pinning it exactly made a clean install fail to build from source.
dependencies = [
    "fastapi>=0.115.6,<1.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.7.1",
    "motor>=3.6.0",
    "beanie>=1.29.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "google-genai>=1.9.0",
    "earthengine-api>=1.4.3",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.6",
    "mypy>=1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101: pytest asserts.
# B008: `Depends(...)`/`File(...)` in a default IS the FastAPI idiom.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# The seed uses a fixed-seed PRNG so the demo is reproducible. Not cryptographic.
"scripts/seed.py" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
