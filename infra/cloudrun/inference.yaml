apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agrimitra-inference
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '10'
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/agrimitra-inference:latest
        ports:
        - containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: GEMINI_API_KEY
              key: 'latest'
        resources:
          limits:
            memory: "2Gi"
