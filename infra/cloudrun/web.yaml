apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agrimitra-web
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '20'
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/agrimitra-web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            secretKeyRef:
              name: NEXT_PUBLIC_API_URL
              key: 'latest'
